    <!-- ===== Toast ===== -->
    <div id="toast-notification" class="toast hidden" role="status" aria-live="polite">
        <div class="toast-content">
            <span class="toast-check" aria-hidden="true">✓</span>
            <p>Wonderful! You completed: <span id="completed-habit-name">Deep Work</span></p>
        </div>
    </div>

    <!-- ===== Modal ===== -->
    <div id="add-habit-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <button class="btn-close-modal" aria-label="Close" type="button">×</button>
            <header class="modal-header">
                <h2 id="modalTitle">New Ritual</h2>
            </header>

            <form id="new-habit-form">
                <div class="form-group">
                    <label for="habit-name">Habit Name</label>
                    <input type="text" id="habit-name" placeholder="e.g., Morning Meditation" required />
                </div>

                <div class="form-group">
                    <label for="habit-category">Category</label>
                    <div class="select-wrapper">
                        <select id="habit-category">
                            <option value="health">Health</option>
                            <option value="learning">Learning</option>
                            <option value="mindfulness">Mindfulness</option>
                            <option value="productivity">Productivity</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="habit-frequency">Frequency</label>
                    <div class="select-wrapper">
                        <select id="habit-frequency">
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="habit-reminder-time">Reminder Time</label>
                    <input type="time" id="habit-reminder-time" />
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel">Cancel</button>

                    <button type="submit" class="btn-create">Save</button>

                    <button type="button" class="btn-danger hidden" id="btn-delete-habit">Delete</button>

                </div>
            </form>
        </div>
    </div>

    <footer class="site-footer">
